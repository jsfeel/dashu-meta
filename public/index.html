<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meta 광고 대시보드</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --active: #16a34a;
    --paused: #9ca3af;
    --danger: #dc2626;
    --warn-bg: #fff7ed;
    --warn-text: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header { padding: 24px 32px 0; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 32px;
    margin-bottom: 20px;
  }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tab-btn.sub { padding: 6px 14px; font-size: 13px; }
  select, input[type="date"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    padding: 0 32px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .summary-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .summary-card .value { font-size: 20px; font-weight: 600; }

  .warn-banner {
    margin: 0 32px 16px;
    padding: 10px 14px;
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 8px;
    font-size: 13px;
  }

  .table-wrap { padding: 0 32px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px 14px; text-align: right; font-size: 13px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; background: #fafafa; }
  tbody tr:hover { background: #f9fafb; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ACTIVE { background: #dcfce7; color: var(--active); }
  .badge.PAUSED { background: #f3f4f6; color: var(--paused); }
  .badge.UNKNOWN, .badge.ARCHIVED, .badge.DELETED { background: #f3f4f6; color: var(--text-muted); }
  .channel-tag { font-size: 11px; color: var(--text-muted); background: #f3f4f6; padding: 2px 8px; border-radius: 6px; }

  tr.level-0 { font-weight: 600; }
  tr.level-1 td { background: #fafbfc; }
  tr.level-2 td { background: #f5f6f8; color: var(--text-muted); }
  .name-cell { display: flex; align-items: center; gap: 6px; }
  .toggle-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 10px;
    flex-shrink: 0;
  }
  .toggle-icon.leaf { visibility: hidden; }
  .row-clickable { cursor: pointer; }

  .state-msg { padding: 40px 32px; color: var(--text-muted); text-align: center; }
  .error { color: var(--danger); }

  /* 소재 상세 패널 */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; justify-content: flex-end; z-index: 100;
  }
  .detail-panel {
    background: var(--card-bg); width: 420px; max-width: 92vw; height: 100%;
    overflow-y: auto; padding: 20px; position: relative; box-shadow: -4px 0 24px rgba(0,0,0,0.15);
  }
  .detail-close {
    position: absolute; top: 16px; right: 16px; border: none; background: none;
    font-size: 18px; cursor: pointer; color: var(--text-muted);
  }
  .detail-name { font-size: 16px; font-weight: 700; margin: 0 24px 4px 0; }
  .detail-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .judgment-banner {
    border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
  }
  .judgment-banner.good { background: #dcfce7; color: var(--active); }
  .judgment-banner.warn { background: #fef3c7; color: #b45309; }
  .judgment-banner.bad { background: #fee2e2; color: var(--danger); }
  .detail-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .detail-metric { background: #f9fafb; border-radius: 8px; padding: 8px; text-align: center; }
  .detail-metric .l { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .detail-metric .v { font-size: 13px; font-weight: 700; }
  .detail-section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
  .chart-wrap { position: relative; height: 160px; margin-bottom: 8px; }
  .fatigue-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .fatigue-note {
    margin-top: 6px; padding: 6px 10px; border-radius: 8px; font-size: 12px;
  }
  .fatigue-note.on { background: #fef3c7; color: #b45309; }
  .fatigue-note.off { background: #f3f4f6; color: var(--text-muted); }
  .lifespan-row { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .lifespan-step { flex: 1; text-align: center; background: #f9fafb; border-radius: 8px; padding: 8px 4px; }
  .lifespan-step .l { color: var(--text-muted); font-size: 10px; }
  .lifespan-step .v { font-weight: 700; font-size: 12px; }
  .lifespan-arrow { color: var(--text-muted); font-size: 11px; white-space: nowrap; padding: 0 2px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
        onerror="var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'; document.head.appendChild(s);"></script>
</head>
<body>

<header>
  <div class="header-row" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
    <h1>Meta 광고 대시보드</h1>
    <button class="tab-btn sub" id="refresh-btn">↻ 새로고침</button>
  </div>
  <div class="subtitle" id="updated-at">불러오는 중...</div>
</header>

<div class="controls">
  <div class="row">
    <div class="tab-group" id="brand-tabs">
      <button class="tab-btn active" data-brand="dashu">다슈</button>
      <button class="tab-btn" data-brand="daleaf">달리프</button>
      <button class="tab-btn" data-brand="fleef">플리프</button>
      <button class="tab-btn" data-brand="ohype">오하입</button>
    </div>
    <select id="range-select">
      <option value="today">오늘</option>
      <option value="yesterday">어제</option>
      <option value="last_7d" selected>최근 7일</option>
      <option value="last_14d">최근 14일</option>
      <option value="last_30d">최근 30일</option>
      <option value="this_month">이번 달</option>
      <option value="last_month">지난 달</option>
      <option value="custom">직접 설정</option>
    </select>
    <div id="custom-range-wrap" style="display:none; align-items:center; gap:6px;">
      <input type="date" id="date-since" />
      <span style="color:var(--text-muted); font-size:13px;">~</span>
      <input type="date" id="date-until" />
      <button class="tab-btn sub" id="apply-custom-range">조회</button>
    </div>
  </div>
  <div class="row">
    <div class="tab-group sub-group" id="channel-tabs"></div>
  </div>
</div>

<div id="warn-banner-slot"></div>
<div class="summary-grid" id="summary-grid"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>캠페인 / 광고세트 / 소재</th>
        <th>채널</th>
        <th>상태</th>
        <th>소진액</th>
        <th>노출수</th>
        <th>클릭수</th>
        <th>CTR</th>
        <th>CPC</th>
        <th>구매</th>
        <th>매출</th>
        <th>ROAS</th>
      </tr>
    </thead>
    <tbody id="campaign-tbody">
      <tr><td colspan="11" class="state-msg">불러오는 중...</td></tr>
    </tbody>
  </table>
</div>

<div id="detail-overlay" class="detail-overlay" style="display:none;">
  <div class="detail-panel">
    <button class="detail-close" id="detail-close">✕</button>
    <div id="detail-body"><div class="state-msg">불러오는 중...</div></div>
  </div>
</div>

<script>
  // 브랜드별 채널 구성 (실제 계정ID/토큰은 서버(Worker)에서만 관리)
  const CHANNELS = {
    dashu: [
      { key: 'all', label: '전체' },
      { key: 'own', label: '자사몰' },
      { key: 'musinsa', label: '무신사' },
      { key: 'naver', label: '네이버' },
      { key: 'oy', label: '올리브영' },
    ],
    daleaf: [
      { key: 'all', label: '전체' },
      { key: 'own', label: '자사몰' },
      { key: 'oy', label: '올리브영' },
      { key: 'musinsa', label: '무신사' },
      { key: 'naver', label: '네이버' },
    ],
    fleef: [
      { key: 'all', label: '전체' },
      { key: 'own', label: '자사몰' },
      { key: 'oy', label: '올리브영' },
      { key: 'musinsa', label: '무신사' },
      { key: 'naver', label: '네이버' },
    ],
    ohype: [
      { key: 'all', label: '전체' },
      { key: 'own', label: '자사몰' },
      { key: 'oy', label: '올리브영' },
      { key: 'musinsa', label: '무신사' },
      { key: '29cm', label: '29CM' },
    ],
  };

  const brandTabs = document.getElementById('brand-tabs');
  const channelTabs = document.getElementById('channel-tabs');
  const rangeSelect = document.getElementById('range-select');
  const customRangeWrap = document.getElementById('custom-range-wrap');
  const dateSince = document.getElementById('date-since');
  const dateUntil = document.getElementById('date-until');
  const applyCustomRange = document.getElementById('apply-custom-range');
  const summaryGrid = document.getElementById('summary-grid');
  const tbody = document.getElementById('campaign-tbody');
  const updatedAt = document.getElementById('updated-at');
  const warnSlot = document.getElementById('warn-banner-slot');
  const refreshBtn = document.getElementById('refresh-btn');

  let currentBrand = 'dashu';
  let currentChannel = 'all';

  // 기본 커스텀 기간 값: 최근 7일
  const today = new Date();
  const weekAgo = new Date(today);
  weekAgo.setDate(today.getDate() - 6);
  dateUntil.value = today.toISOString().slice(0, 10);
  dateSince.value = weekAgo.toISOString().slice(0, 10);

  const fmtWon = (n) => '₩' + Math.round(n).toLocaleString('ko-KR');
  const fmtNum = (n) => Math.round(n).toLocaleString('ko-KR');
  const fmtPct = (n) => n.toFixed(2) + '%';
  const fmtRoas = (n) => n.toFixed(2) + 'x';

  const statusLabel = {
    ACTIVE: '운영중', PAUSED: '일시중지', ARCHIVED: '보관됨', DELETED: '삭제됨', UNKNOWN: '알 수 없음',
  };

  function renderChannelTabs() {
    const list = CHANNELS[currentBrand];
    channelTabs.innerHTML = list.map(c =>
      `<button class="tab-btn sub ${c.key === currentChannel ? 'active' : ''}" data-channel="${c.key}">${c.label}</button>`
    ).join('');
  }

  async function loadData() {
    tbody.innerHTML = '<tr><td colspan="11" class="state-msg">불러오는 중...</td></tr>';
    summaryGrid.innerHTML = '';
    warnSlot.innerHTML = '';
    updatedAt.textContent = '불러오는 중...';

    const brand = currentBrand;
    const channel = currentChannel;
    const range = rangeSelect.value;

    let dateQuery = '';
    if (range === 'custom') {
      if (!dateSince.value || !dateUntil.value) {
        tbody.innerHTML = '<tr><td colspan="11" class="state-msg error">시작일과 종료일을 모두 선택해주세요.</td></tr>';
        updatedAt.textContent = '';
        return;
      }
      dateQuery = `since=${dateSince.value}&until=${dateUntil.value}`;
    } else {
      dateQuery = `range=${range}`;
    }
    currentDateQuery = dateQuery; // 광고세트/소재 지연 로딩 시 동일한 기간을 재사용

    try {
      const res = await fetch(`/api/meta-ads?brand=${brand}&channel=${channel}&${dateQuery}`);
      const data = await res.json();

      if (data.error) {
        tbody.innerHTML = `<tr><td colspan="11" class="state-msg error">오류: ${data.error}</td></tr>`;
        updatedAt.textContent = '';
        return;
      }

      if (data.partialErrors && data.partialErrors.length > 0) {
        warnSlot.innerHTML = `<div class="warn-banner">일부 채널 조회 실패: ${data.partialErrors.map(escapeHtml).join(' / ')}</div>`;
      }

      renderSummary(data.summary);
      renderTable(data.campaigns);
      updatedAt.textContent = `마지막 업데이트: ${new Date(data.fetchedAt).toLocaleString('ko-KR')}`;
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="11" class="state-msg error">불러오기 실패: ${err.message}</td></tr>`;
      updatedAt.textContent = '';
    }
  }

  let currentDateQuery = '';

  function renderSummary(s) {
    const cards = [
      { label: '총 소진액', value: fmtWon(s.spend) },
      { label: '노출수', value: fmtNum(s.impressions) },
      { label: '클릭수', value: fmtNum(s.clicks) },
      { label: '평균 CTR', value: fmtPct(s.ctr) },
      { label: '평균 CPC', value: fmtWon(s.cpc) },
      { label: '구매 건수', value: fmtNum(s.purchases) },
      { label: '전환 매출', value: fmtWon(s.revenue) },
      { label: 'ROAS', value: fmtRoas(s.roas) },
      { label: '운영중 캠페인', value: `${s.activeCampaigns} / ${s.totalCampaigns}` },
    ];
    summaryGrid.innerHTML = cards.map(c =>
      `<div class="summary-card"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
    ).join('');
  }

  // 캠페인 목록만 최초에 렌더링 (지연 로딩) - 광고세트/소재는 클릭 시 API로 추가 조회
  function renderTable(campaigns) {
    if (!campaigns.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="state-msg">해당 기간에 데이터가 없습니다.</td></tr>';
      return;
    }

    const rows = campaigns.map((c, ci) => {
      const rowId = `c${ci}`;
      return renderRow({
        item: c,
        level: 0,
        rowId,
        parentId: null,
        hasChildren: true,
        channel: c.channel,
        kind: 'campaign',
        objectId: c.id,
        channelKey: c.channelKey,
      });
    });

    tbody.innerHTML = rows.join('');
  }

  function renderRow({ item, level, rowId, parentId, hasChildren, channel, kind, objectId, channelKey }) {
    const indent = level * 20;
    const toggleIcon = hasChildren
      ? `<span class="toggle-icon" data-toggle="${rowId}">▶</span>`
      : `<span class="toggle-icon leaf">•</span>`;
    const rowClass = `level-${level}${hasChildren ? ' row-clickable' : ''}`;
    const style = level === 0 ? '' : ' style="display:none;"';
    const detailBtn =
      kind === 'ad'
        ? `<button class="tab-btn sub detail-btn" data-detail-ad="${objectId}" data-channel-key="${channelKey}" style="margin-left:6px; padding:2px 8px; font-size:11px;">상세</button>`
        : '';

    return `
      <tr class="${rowClass}" data-row-id="${rowId}" data-parent="${parentId || ''}"
          data-kind="${kind || ''}" data-object-id="${objectId || ''}" data-channel-key="${channelKey || ''}"${style}>
        <td>
          <div class="name-cell" style="padding-left:${indent}px;">
            ${toggleIcon}
            <span>${escapeHtml(item.name || '(이름 없음)')}</span>
            ${detailBtn}
          </div>
        </td>
        <td>${channel ? `<span class="channel-tag">${escapeHtml(channel)}</span>` : ''}</td>
        <td><span class="badge ${item.status}">${statusLabel[item.status] || item.status}</span></td>
        <td>${fmtWon(item.spend)}</td>
        <td>${fmtNum(item.impressions)}</td>
        <td>${fmtNum(item.clicks)}</td>
        <td>${fmtPct(item.ctr)}</td>
        <td>${fmtWon(item.cpc)}</td>
        <td>${fmtNum(item.purchases)}</td>
        <td>${fmtWon(item.revenue)}</td>
        <td>${fmtRoas(item.roas)}</td>
      </tr>
    `;
  }

  function loadingRow(parentId, level) {
    return `<tr data-loading-for="${parentId}" data-parent="${parentId}">
      <td colspan="11" style="padding-left:${level * 20 + 20}px; color:var(--text-muted); font-size:12px;">불러오는 중...</td>
    </tr>`;
  }

  async function toggleRow(rowId) {
    const row = tbody.querySelector(`tr[data-row-id="${rowId}"]`);
    if (!row) return;
    const icon = row.querySelector(`.toggle-icon[data-toggle="${rowId}"]`);
    const isExpanded = row.classList.contains('expanded');

    if (isExpanded) {
      collapseRow(rowId);
      return;
    }

    const alreadyLoaded = tbody.querySelector(`tr[data-parent="${rowId}"]`);
    if (alreadyLoaded) {
      // 이미 한 번 불러온 적이 있으면 재조회 없이 다시 보여주기만 함
      tbody.querySelectorAll(`tr[data-parent="${rowId}"]`).forEach((r) => { r.style.display = ''; });
      row.classList.add('expanded');
      if (icon) icon.textContent = '▼';
      return;
    }

    const kind = row.dataset.kind;
    const objectId = row.dataset.objectId;
    const channelKey = row.dataset.channelKey;
    const level = kind === 'campaign' ? 1 : 2;

    row.insertAdjacentHTML('afterend', loadingRow(rowId, level));
    row.classList.add('expanded');
    if (icon) icon.textContent = '▼';

    try {
      let children = [];
      if (kind === 'campaign') {
        const res = await fetch(
          `/api/meta-ads/adsets?brand=${currentBrand}&channel=${channelKey}&campaignId=${objectId}&${currentDateQuery}`
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        children = data.adsets.map((as, i) => ({
          item: as,
          level: 1,
          rowId: `${rowId}-as${i}`,
          parentId: rowId,
          hasChildren: true,
          channel: null,
          kind: 'adset',
          objectId: as.id,
          channelKey,
        }));
      } else {
        const res = await fetch(
          `/api/meta-ads/ads?brand=${currentBrand}&channel=${channelKey}&adsetId=${objectId}&${currentDateQuery}`
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        children = data.ads.map((ad, i) => ({
          item: ad,
          level: 2,
          rowId: `${rowId}-ad${i}`,
          parentId: rowId,
          hasChildren: false,
          channel: null,
          kind: 'ad',
          objectId: ad.id,
          channelKey,
        }));
      }

      const loadingEl = tbody.querySelector(`tr[data-loading-for="${rowId}"]`);
      if (children.length === 0) {
        const emptyHtml = `<tr data-parent="${rowId}"><td colspan="11" style="padding-left:${(level) * 20 + 20}px; color:var(--text-muted); font-size:12px;">하위 항목이 없습니다.</td></tr>`;
        loadingEl.outerHTML = emptyHtml;
      } else {
        loadingEl.outerHTML = children.map(renderRow).map(html => html.replace('style="display:none;"', '')).join('');
      }
    } catch (err) {
      const loadingEl = tbody.querySelector(`tr[data-loading-for="${rowId}"]`);
      if (loadingEl) {
        loadingEl.outerHTML = `<tr data-parent="${rowId}"><td colspan="11" class="error" style="padding-left:20px; font-size:12px;">불러오기 실패: ${escapeHtml(err.message)}</td></tr>`;
      }
    }
  }

  function collapseRow(rowId) {
    const row = tbody.querySelector(`tr[data-row-id="${rowId}"]`);
    if (!row) return;
    row.classList.remove('expanded');
    const icon = row.querySelector(`.toggle-icon[data-toggle="${rowId}"]`);
    if (icon) icon.textContent = '▶';

    tbody.querySelectorAll(`tr[data-parent="${rowId}"]`).forEach((r) => {
      r.style.display = 'none';
      if (r.dataset.rowId) collapseRow(r.dataset.rowId);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- 소재 상세 패널 ----------
  const detailOverlay = document.getElementById('detail-overlay');
  const detailBody = document.getElementById('detail-body');
  const detailClose = document.getElementById('detail-close');
  let detailChart1 = null;
  let detailChart2 = null;

  const statusDotColor = { ACTIVE: '#16a34a', PAUSED: '#9ca3af' };
  const judgmentTagStyle = { good: 'good', warn: 'warn', bad: 'bad' };

  async function openDetail(adId, channelKey) {
    detailOverlay.style.display = 'flex';
    detailBody.innerHTML = '<div class="state-msg">불러오는 중...</div>';

    try {
      const res = await fetch(
        `/api/meta-ads/ad-detail?brand=${currentBrand}&channel=${channelKey}&adId=${adId}&${currentDateQuery}`
      );
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderDetail(data);
    } catch (err) {
      detailBody.innerHTML = `<div class="state-msg error">불러오기 실패: ${escapeHtml(err.message)}</div>`;
    }
  }

  function closeDetail() {
    detailOverlay.style.display = 'none';
    if (detailChart1) { detailChart1.destroy(); detailChart1 = null; }
    if (detailChart2) { detailChart2.destroy(); detailChart2 = null; }
  }

  detailClose.addEventListener('click', closeDetail);
  detailOverlay.addEventListener('click', (e) => { if (e.target === detailOverlay) closeDetail(); });

  function renderDetail(d) {
    const s = d.summary;
    const j = d.judgment;
    const f = d.fatigue;
    const l = d.lifespan;

    detailBody.innerHTML = `
      <h2 class="detail-name">${escapeHtml(d.name || '(이름 없음)')}</h2>
      <div class="detail-tags">
        <span class="badge ${d.status}">${statusLabel[d.status] || d.status}</span>
      </div>
      <div class="judgment-banner ${j.tone}">${j.label} — ${j.action}</div>

      <div class="detail-grid">
        <div class="detail-metric"><div class="l">지출</div><div class="v">${fmtWon(s.spend)}</div></div>
        <div class="detail-metric"><div class="l">구매가치</div><div class="v">${fmtWon(s.revenue)}</div></div>
        <div class="detail-metric"><div class="l">ROAS</div><div class="v">${fmtRoas(s.roas)}</div></div>
        <div class="detail-metric"><div class="l">CTR</div><div class="v">${fmtPct(s.ctr)}</div></div>
        <div class="detail-metric"><div class="l">CPA</div><div class="v">${s.cpa != null ? fmtWon(s.cpa) : '-'}</div></div>
        <div class="detail-metric"><div class="l">빈도</div><div class="v">${s.frequency.toFixed(2)}</div></div>
        <div class="detail-metric"><div class="l">집행일수</div><div class="v">${d.daily.length}일</div></div>
        <div class="detail-metric"><div class="l">생성일</div><div class="v">${d.createdDate || '-'}</div></div>
      </div>

      <div class="detail-section-title">일별 지출 · ROAS</div>
      <div class="chart-wrap"><canvas id="chart-spend-roas"></canvas></div>

      <div class="detail-section-title">CTR · 빈도</div>
      <div class="chart-wrap"><canvas id="chart-ctr-freq"></canvas></div>

      <div class="detail-section-title">피로도</div>
      <div class="fatigue-grid">
        <div class="detail-metric"><div class="l">초기 3일 CTR</div><div class="v">${fmtPct(f.earlyCtr)}</div></div>
        <div class="detail-metric"><div class="l">최근 3일 CTR</div><div class="v">${fmtPct(f.recentCtr)} (${f.ctrDropRatio >= 0 ? '-' : '+'}${Math.abs(f.ctrDropRatio * 100).toFixed(0)}%)</div></div>
        <div class="detail-metric"><div class="l">최근 빈도</div><div class="v">${f.frequency.toFixed(2)}</div></div>
      </div>
      <div class="fatigue-note ${f.fatigued ? 'on' : 'off'}">${f.fatigued ? '피로 징후 — 교체 검토 대상' : '피로 징후 없음'}</div>

      <div class="detail-section-title">수명</div>
      <div class="lifespan-row">
        <div class="lifespan-step"><div class="l">생성</div><div class="v">${l.createdDate || '-'}</div></div>
        <div class="lifespan-arrow">+${l.daysCreatedToFirstSpend ?? '-'}일</div>
        <div class="lifespan-step"><div class="l">첫 지출</div><div class="v">${l.firstSpendDate || '-'}</div></div>
        <div class="lifespan-arrow">+${l.daysFirstToLastSpend ?? '-'}일</div>
        <div class="lifespan-step"><div class="l">마지막 지출</div><div class="v">${l.lastSpendDate || '-'}</div></div>
      </div>
    `;

    const labels = d.daily.map((row) => row.date.slice(5)); // MM-DD

    if (typeof Chart === 'undefined') {
      // Chart.js가 네트워크 정책 등으로 로드되지 않은 경우 - 나머지 정보는 정상 표시하고 차트만 대체 문구로 안내
      document.querySelectorAll('.chart-wrap').forEach((el) => {
        el.innerHTML = '<div class="state-msg" style="padding:20px 0;">차트 라이브러리를 불러오지 못했습니다 (네트워크 차단 가능성). 다른 네트워크에서 다시 시도해주세요.</div>';
      });
      return;
    }

    try {
      if (detailChart1) detailChart1.destroy();
      detailChart1 = new Chart(document.getElementById('chart-spend-roas'), {
        data: {
          labels,
          datasets: [
            {
              type: 'bar',
              label: '지출',
              data: d.daily.map((row) => row.spend),
              backgroundColor: '#d69e4f',
              yAxisID: 'y',
            },
            {
              type: 'line',
              label: 'ROAS',
              data: d.daily.map((row) => row.roas),
              borderColor: '#16a34a',
              backgroundColor: '#16a34a',
              yAxisID: 'y1',
              tension: 0.3,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { position: 'left', ticks: { font: { size: 9 } } },
            y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 9 } } },
            x: { ticks: { font: { size: 9 } } },
          },
        },
      });

      if (detailChart2) detailChart2.destroy();
      detailChart2 = new Chart(document.getElementById('chart-ctr-freq'), {
        data: {
          labels,
          datasets: [
            {
              type: 'line',
              label: 'CTR',
              data: d.daily.map((row) => row.ctr),
              borderColor: '#d69e4f',
              yAxisID: 'y',
              tension: 0.3,
            },
            {
              type: 'line',
              label: '빈도',
              data: d.daily.map((row) => row.frequency),
              borderColor: '#9ca3af',
              borderDash: [4, 4],
              yAxisID: 'y1',
              tension: 0.3,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { position: 'left', ticks: { font: { size: 9 } } },
            y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 9 } } },
            x: { ticks: { font: { size: 9 } } },
          },
        },
      });
    } catch (chartErr) {
      // 차트 렌더링만 실패한 경우 - 나머지 정보는 이미 표시된 상태를 유지하고 차트 영역만 안내 문구로 대체
      document.querySelectorAll('.chart-wrap').forEach((el) => {
        el.innerHTML = '<div class="state-msg" style="padding:20px 0;">차트를 그리지 못했습니다.</div>';
      });
    }
  }

  brandTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    brandTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBrand = btn.dataset.brand;
    currentChannel = 'all';
    renderChannelTabs();
    loadData();
  });

  channelTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    channelTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentChannel = btn.dataset.channel;
    loadData();
  });

  tbody.addEventListener('click', (e) => {
    const detailBtn = e.target.closest('.detail-btn');
    if (detailBtn) {
      openDetail(detailBtn.dataset.detailAd, detailBtn.dataset.channelKey);
      return;
    }
    const row = e.target.closest('tr[data-row-id]');
    if (!row) return;
    if (!row.classList.contains('row-clickable')) return;
    toggleRow(row.dataset.rowId);
  });

  rangeSelect.addEventListener('change', () => {
    if (rangeSelect.value === 'custom') {
      customRangeWrap.style.display = 'flex';
      // 날짜를 아직 조회하지 않은 상태이므로, 조회 버튼을 누르기 전까지는 목록을 갱신하지 않음
    } else {
      customRangeWrap.style.display = 'none';
      loadData();
    }
  });

  applyCustomRange.addEventListener('click', loadData);
  refreshBtn.addEventListener('click', loadData);

  renderChannelTabs();
  loadData();
</script>

</body>
</html>
